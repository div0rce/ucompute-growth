name: claims-lint
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Lint self-tests
        run: python3 scripts/test_claims_lint.py && python3 scripts/measure_public.py --selftest
      - name: Claims lint (everything publishable)
        run: python3 scripts/claims_lint.py content --strict
      - name: Identity scan of handoffs and channel files
        run: python3 scripts/claims_lint.py handoffs channels
